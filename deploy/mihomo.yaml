mixed-port: 0
redir-port: 7893
bind-address: '*'
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5]
  proxy-server-nameserver: [223.5.5.5]
  nameserver: ['https://1.1.1.1/dns-query#出站策略']
tun:
  enable: false
proxies: []
proxy-groups:
  - name: 出站策略
    type: select
    proxies: [DIRECT]
rules:
  - MATCH,DIRECT
