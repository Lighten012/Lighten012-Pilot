<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lighten012 Pilot · DNS</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif; background:#090d18; color:#e9edf8; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0%,#192b47 0,transparent 34%),radial-gradient(circle at 92% 0%,#152c2e 0,transparent 30%),#090d18 }
    .wrap { max-width:1060px; margin:auto; padding:40px 24px 80px } header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:50px }
    .brand { display:flex; align-items:center; gap:14px; font-weight:750; letter-spacing:.02em; font-size:17px } .logo { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(140deg,#7debd0,#4790d7); color:#081521; font-weight:900 }
    .pill { border:1px solid #264b48; background:#11302e; color:#8ce6cf; padding:8px 13px; border-radius:99px; font-size:12px; white-space:nowrap }
    .eyebrow { font-size:12px; letter-spacing:.19em; color:#80b6b8; font-weight:750; text-transform:uppercase } h1 { font-size:clamp(34px,6vw,58px); letter-spacing:-.05em; line-height:1.05; margin:14px 0 } .intro { color:#9ca9c0; max-width:620px; line-height:1.8; margin:0 0 34px }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px } .stat,.card { background:#111827df; border:1px solid #263044; border-radius:20px; box-shadow:0 18px 50px #05091030 }
    .stat { padding:22px 24px } .stat small { color:#8c9ab0; font-size:12px } .stat strong { display:block; font-size:28px; margin-top:10px; letter-spacing:-.03em }
    .card { padding:26px; margin-top:18px } .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px } h2 { font-size:20px; margin:0 0 7px } .muted { color:#8c9ab0; margin:0; font-size:13px; line-height:1.6 }
    .form-row { display:grid; grid-template-columns:1.5fr 110px 1.5fr 95px auto; gap:10px; align-items:end } label { display:block; color:#aab7ca; font-size:12px; font-weight:650; margin-bottom:8px } input,select { width:100%; height:42px; border:1px solid #354159; border-radius:10px; background:#0c1422; color:#edf4ff; padding:0 12px; outline:none; font:inherit; font-size:14px } input:focus,select:focus { border-color:#6fd9c5; box-shadow:0 0 0 3px #51c5b623 }
    button { height:42px; padding:0 17px; border:0; border-radius:10px; font:inherit; font-weight:720; cursor:pointer; white-space:nowrap } .primary { background:#86e3ce; color:#0b2625 } .primary:hover { background:#a5f5e2 } .secondary { color:#c6d1e1; background:#223046 } .danger { color:#ffb6ad; background:#3b242d } button:disabled { opacity:.55; cursor:wait }
    .upstream { display:flex; gap:12px; align-items:end; max-width:420px } .upstream > div { flex:1 } .table-wrap { overflow:auto } table { width:100%; border-collapse:collapse; text-align:left; font-size:14px } th { color:#7f90a8; font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; padding:11px 8px; border-bottom:1px solid #293348 } td { padding:15px 8px; border-bottom:1px solid #202a3d } td code { color:#b3eadb; font-size:13px } td:last-child { text-align:right } .empty { color:#8796ad; padding:24px 8px }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:26px } #message { color:#92d9c8; font-size:13px; min-height:20px } .hint { font-size:12px; color:#718198; margin-top:17px; line-height:1.6 } .hint code { color:#b6c5d9 }
    @media(max-width:700px){ .wrap{padding:24px 16px 60px} header{margin-bottom:34px} .grid{grid-template-columns:1fr 1fr} .grid .stat:last-child{grid-column:span 2} .form-row{grid-template-columns:1fr 1fr} .form-row .wide{grid-column:span 2} .form-row button{grid-column:span 2} .card{padding:20px} }
  </style>
</head>
<body><div class="wrap">
  <header><div class="brand"><div class="logo">P</div><span>Lighten012 Pilot</span></div><div class="pill">DNS · v2</div></header>
  <main>
    <div class="eyebrow">DNS Control</div><h1>让域名指向你想去的地方。</h1>
    <p class="intro">为内网域名指定解析地址。未配置的域名会交给上游 DNS；修改记录后点击保存即可生效。</p>
    <div class="grid"><div class="stat"><small>总查询</small><strong id="queries">—</strong></div><div class="stat"><small>本地命中</small><strong id="local">—</strong></div><div class="stat"><small>上游转发</small><strong id="forwarded">—</strong></div></div>
    <section class="card"><div class="card-head"><div><h2>上游 DNS</h2><p class="muted">没有本地记录时由它继续解析。</p></div></div><div class="upstream"><div><label for="upstream">IPv4 地址</label><input id="upstream" placeholder="119.29.29.29" inputmode="decimal"></div></div></section>
    <section class="card"><div class="card-head"><div><h2>自定义解析记录</h2><p class="muted">域名精确匹配，支持 A 和 AAAA。</p></div><span class="pill" id="count">0 条记录</span></div>
      <form id="add-form" class="form-row"><div class="wide"><label for="name">域名</label><input id="name" placeholder="lighten012.home" required></div><div><label for="type">类型</label><select id="type"><option>A</option><option>AAAA</option></select></div><div class="wide"><label for="value">IP 地址</label><input id="value" placeholder="192.168.50.178" required></div><div><label for="ttl">TTL / 秒</label><input id="ttl" type="number" min="1" max="86400" value="60" required></div><button class="secondary">添加记录</button></form>
      <div class="table-wrap"><table><thead><tr><th>域名</th><th>类型</th><th>地址</th><th>TTL</th><th></th></tr></thead><tbody id="records"></tbody></table></div>
      <p class="hint">同一域名已有本地记录时，其他查询类型不会转发到上游。删除记录后保存，域名才会恢复上游解析。</p>
    </section>
    <div class="footer"><span id="message"></span><button id="save" class="primary">保存并应用</button></div>
    <p class="hint">测试：<code>nslookup lighten012.home 192.168.50.178</code>。客户端需要能访问 DNS 监听地址。</p>
  </main>
</div><script>
let records=[];
const $=id=>document.getElementById(id);
function message(s,error=false){$('message').textContent=s;$('message').style.color=error?'#ffb6ad':'#92d9c8'}
function render(){const body=$('records');body.replaceChildren();$('count').textContent=records.length+' 条记录';if(!records.length){const row=document.createElement('tr');const cell=document.createElement('td');cell.colSpan=5;cell.className='empty';cell.textContent='还没有记录，先添加一条吧。';row.append(cell);body.append(row);return} records.forEach((r,i)=>{const row=document.createElement('tr');for(const value of [r.name,r.type,r.value,String(r.ttl)]){const cell=document.createElement('td');const code=document.createElement('code');code.textContent=value;cell.append(code);row.append(cell)}const cell=document.createElement('td');const button=document.createElement('button');button.className='danger';button.textContent='删除';button.onclick=()=>{records.splice(i,1);render();message('有未保存的修改')};cell.append(button);row.append(cell);body.append(row)})}
async function load(){try{const r=await fetch('/api/state');if(!r.ok)throw new Error('无法读取配置');const data=await r.json();records=data.config.records||[];$('upstream').value=data.config.upstream;for(const key of ['queries','local','forwarded'])$(key).textContent=data.stats[key].toLocaleString();render()}catch(e){message(e.message,true)}}
$('add-form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim().replace(/\.$/,'').toLowerCase(),type=$('type').value,value=$('value').value.trim(),ttl=Number($('ttl').value);if(records.some(r=>r.name===name&&r.type===type)){message('同一域名和类型只能添加一次',true);return}records.push({name,type,value,ttl});render();$('name').value='';$('value').value='';message('有未保存的修改')};
$('save').onclick=async()=>{const button=$('save');button.disabled=true;try{const r=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json','X-Pilot-Request':'1'},body:JSON.stringify({upstream:$('upstream').value.trim(),records})});if(!r.ok)throw new Error((await r.text()).trim());const data=await r.json();records=data.records;render();message('已保存，DNS 记录立即生效')}catch(e){message(e.message,true)}finally{button.disabled=false}};
load();setInterval(async()=>{try{const r=await fetch('/api/state');const data=await r.json();for(const key of ['queries','local','forwarded'])$(key).textContent=data.stats[key].toLocaleString()}catch{}},10000);
</script></body></html>
